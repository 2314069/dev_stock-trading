[project]
name = "nikkei-futures-hub"
version = "0.0.0"
description = "Nikkei futures information site backend (AI prediction, news aggregation)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "anthropic>=0.40",
    "yfinance>=0.2",
    "pandas>=2.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/config",
    "src/llm",
    "src/agents",
    "src/data",
    "src/features",
    "src/graph",
    "src/eval",
    "src/api",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
