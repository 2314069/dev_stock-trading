id: s01_baseline
title: F-08 baseline (5 agents, 1-round debate, news 集約なし)
based_on: null
playbook: architectures/a01_f08_subagent/playbook.md

prompts:
  # null = canonical (src/agents/<agent>.py の SYSTEM_PROMPT) を使う
  # 差替する場合のパス例: src/agents/variants/news_analyst/root_cause.md
  news_analyst: null
  technical_analyst: null
  sentiment_aggregator: null
  researcher_bull: null
  researcher_bear: null
  portfolio_manager: null

params:
  debate_rounds: 1
  news_split_by_category: false
  skip_sentiment_aggregator_if_single_news_memo: true
  skip_technical_if_unavailable: true

fixture_constraint: any

hypothesis: |
  (baseline) F-08 を最小構成で 1 回流したときの方向性予測。
  ここを起点に s02 以降の scenarios を増やしていく。

created_at: 2026-05-19
